        // ============================================
        // UTILIDADES
        // ============================================
        const Utils = {
            getElement: (id) => document.getElementById(id),
            query: (sel, ctx = document) => ctx.querySelector(sel),
            queryAll: (sel, ctx = document) => [...ctx.querySelectorAll(sel)],
            debounce(fn, ms = 100) {
                let timer;
                return (...args) => {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn(...args), ms);
                };
            },
            throttle(fn, limit = 100) {
                let inThrottle = false;
                return (...args) => {
                    if (!inThrottle) {
                        fn(...args);
                        inThrottle = true;
                        setTimeout(() => inThrottle = false, limit);
                    }
                };
            },
            animateNumber(el, start, end, duration = 400) {
                let startTime = null;
                const step = (timestamp) => {
                    if (!startTime) startTime = timestamp;
                    const progress = Math.min((timestamp - startTime) / duration, 1);
                    const value = (progress * (end - start) + start);
                    el.textContent = value.toFixed(2);
                    if (progress < 1) requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            },
            formatPrice(value) {
                return value.toFixed(2);
            }
        };

        // ============================================
        // GESTOR DE PRODUCTOS
        // ============================================
        const ProductManager = {
            productos: [],
            carrito: [],
            tasaDolar: null,
            productoActual: null,
            categoriaActual: null,
            dom: {},

            init() {
                this.cacheDOM();
                this.loadCarrito();
                this.cargarProductos();
                this.initEvents();
                this.initParticles();
                this.initScrollProgress();
                this.initParallax();
            },

            cacheDOM() {
                this.dom = {
                    grid: Utils.getElement('product-grid'),
                    cartCount: Utils.getElement('cart-count'),
                    cartItems: Utils.getElement('cart-items'),
                    cartTotal: Utils.getElement('cart-total'),
                    cartTotalBs: Utils.getElement('cart-total-bs'),
                    totalBsDiv: Utils.getElement('total-bs'),
                    tasaValor: Utils.getElement('tasa-valor'),
                    dolarDiv: Utils.getElement('dolar'),
                    cartBtn: Utils.getElement('cart-btn'),
                    cartSidebar: Utils.getElement('cart-sidebar'),
                    cartOverlay: Utils.getElement('cart-overlay'),
                    closeCart: Utils.getElement('close-cart'),
                    whatsappBtn: Utils.getElement('whatsapp-btn'),
                    menuToggle: Utils.getElement('menu-toggle'),
                    mainNav: Utils.getElement('main-nav'),
                    header: Utils.getElement('main-header'),
                    filtersContainer: Utils.getElement('filters-container'),
                    heroBg: Utils.getElement('hero-bg'),
                    detalleOverlay: Utils.getElement('detalle-overlay'),
                    detalleContenido: Utils.getElement('detalle-contenido'),
                    detalleCerrar: Utils.getElement('detalle-cerrar'),
                };
            },

            // ============================================
            // CARGA DE PRODUCTOS
            // ============================================
            async cargarProductos() {
                try {
                    const response = await fetch(CONFIG.JSON_URL);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    this.productos = Array.isArray(data) ? data :
                        (data.productos && Array.isArray(data.productos) ? data.productos : []);
                    this.productos.forEach(p => {
                        if (p.cantidad_por_paquete === undefined) p.cantidad_por_paquete = 1;
                        if (p.tipo_producto === undefined) p.tipo_producto = '';
                        if (p.disponible === undefined) p.disponible = true;
                    });
                } catch (error) {
                    console.error('Error cargando productos:', error);
                    this.productos = this.getFallbackProductos();
                }
                this.generarFiltros();
                this.renderProductos('all');
                // Ya no se aplica tilt al header ni a los filtros
                await this.obtenerTasaDolar();
            },

            getFallbackProductos() {
                return [
                    { id: 1, nombre: "La Patrona Double", categoria: "panes", precio: 8.50, descripcion: "Doble carne de res 200g...", descripcion_larga: "", imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true },
                    { id: 2, nombre: "Urban Classic", categoria: "panes", precio: 5.00, descripcion: "Carne de res 150g...", descripcion_larga: "", imagen: "https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true },
                    { id: 3, nombre: "Crispy Inferno", categoria: "panes", precio: 6.50, descripcion: "Pechuga de pollo extra crujiente...", descripcion_larga: "", imagen: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true },
                    { id: 4, nombre: "Monster Dog", categoria: "charcuteria", precio: 4.50, descripcion: "Salchicha polaca gigante...", descripcion_larga: "", imagen: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true },
                    { id: 5, nombre: "Chori-Perro Supremo", categoria: "charcuteria", precio: 5.50, descripcion: "Pan artesanal, chorizo ahumado...", descripcion_larga: "", imagen: "https://images.unsplash.com/photo-1590165482129-1b8b27698780?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true },
                    { id: 6, nombre: "Coca-Cola 1.5L Hielo", categoria: "bebidas", precio: 2.50, descripcion: "Refresco helado...", descripcion_larga: "", imagen: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true }
                ];
            },

            generarFiltros() {
                const container = this.dom.filtersContainer;
                if (!container) return;
                container.innerHTML = '';
                const categorias = ['all', ...new Set(this.productos.map(p => p.categoria))];
                categorias.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn' + (cat === 'all' ? ' active' : '');
                    btn.dataset.filter = cat;
                    btn.setAttribute('aria-pressed', cat === 'all' ? 'true' : 'false');
                    btn.textContent = cat === 'all' ? 'Menú General' : cat.charAt(0).toUpperCase() + cat.slice(1);
                    btn.addEventListener('click', () => {
                        Utils.queryAll('.filter-btn').forEach(b => {
                            b.classList.remove('active');
                            b.setAttribute('aria-pressed', 'false');
                        });
                        btn.classList.add('active');
                        btn.setAttribute('aria-pressed', 'true');
                        this.renderProductos(btn.dataset.filter);
                    });
                    container.appendChild(btn);
                });
            },

            renderProductos(filtro = 'all') {
                const grid = this.dom.grid;
                grid.innerHTML = '';
                const filtrados = filtro === 'all' ? this.productos : this.productos.filter(p => p.categoria === filtro);
                if (!filtrados.length) {
                    grid.innerHTML =
                        `<p style="color: #888; text-align: center; grid-column: 1/-1; padding: 40px;">No hay productos en esta categoría.</p>`;
                    return;
                }
                const fragment = document.createDocumentFragment();
                filtrados.forEach((producto, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'card-wrapper';
                    wrapper.style.animationDelay = `${index * 0.1}s`;
                    wrapper.dataset.id = producto.id;
                    const disponible = producto.disponible !== false;
                    const badgeAgotado = !disponible ? `<span class="agotado-badge">Agotado</span>` : '';
                    wrapper.innerHTML = `
                        <div class="card" id="card-${producto.id}" data-id="${producto.id}">
                            <div class="card-img-container">
                                <img src="${producto.imagen}" alt="${producto.nombre}" class="card-img" id="img-${producto.id}" loading="lazy">
                                ${badgeAgotado}
                            </div>
                            <div class="card-content">
                                <h3 class="card-title">${producto.nombre}</h3>
                                <p class="card-desc">${producto.descripcion}</p>
                                <div class="card-footer">
                                    <span class="price"><span>$</span>${producto.precio.toFixed(2)}</span>
                                    <button class="btn-add" data-id="${producto.id}" aria-label="Añadir ${producto.nombre}" ${!disponible ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    fragment.appendChild(wrapper);
                });
                grid.appendChild(fragment);

                setTimeout(() => {
                    Utils.queryAll('.card-img', grid).forEach(el => this.applyTilt(el, 5));
                    Utils.queryAll('.price', grid).forEach(el => this.applyTilt(el, 6));
                    this.initCardTilt(grid);
                }, 50);
            },

            // ============================================
            // EFECTO TILT (solo en tarjetas)
            // ============================================
            applyTilt(el, intensity = 10) {
                if (!el || el._tiltInit) return;
                el._tiltInit = true;
                let frameId = null;
                const onMove = (e) => {
                    if (document.body.classList.contains('modo-detalle')) return;
                    if (frameId) cancelAnimationFrame(frameId);
                    frameId = requestAnimationFrame(() => {
                        const rect = el.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        const cx = rect.width / 2;
                        const cy = rect.height / 2;
                        const rx = ((y - cy) / intensity).toFixed(2);
                        const ry = ((cx - x) / intensity).toFixed(2);
                        el.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
                        frameId = null;
                    });
                };
                const onLeave = () => {
                    if (frameId) { cancelAnimationFrame(frameId);
                        frameId = null; }
                    el.style.transition = 'transform 0.5s ease-out';
                    el.style.transform = 'rotateX(0deg) rotateY(0deg)';
                    setTimeout(() => { el.style.transition = 'transform 0.1s'; }, 500);
                };
                el.addEventListener('mousemove', onMove);
                el.addEventListener('mouseleave', onLeave);
            },

            initCardTilt(container = document) {
                Utils.queryAll('.card', container).forEach(card => {
                    if (card._tiltInit) return;
                    card._tiltInit = true;
                    let frameId = null;
                    const onMove = (e) => {
                        if (document.body.classList.contains('modo-detalle')) return;
                        if (frameId) cancelAnimationFrame(frameId);
                        frameId = requestAnimationFrame(() => {
                            const rect = card.getBoundingClientRect();
                            const x = e.clientX - rect.left;
                            const y = e.clientY - rect.top;
                            const cx = rect.width / 2;
                            const cy = rect.height / 2;
                            const rx = ((y - cy) / 10).toFixed(2);
                            const ry = ((cx - x) / 10).toFixed(2);
                            card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
                            frameId = null;
                        });
                    };
                    const onLeave = () => {
                        if (frameId) { cancelAnimationFrame(frameId);
                            frameId = null; }
                        card.style.transition = 'transform 0.5s ease-out';
                        card.style.transform = 'rotateX(0deg) rotateY(0deg)';
                        setTimeout(() => { card.style.transition = 'transform 0.1s'; }, 500);
                    };
                    card.addEventListener('mousemove', onMove);
                    card.addEventListener('mouseleave', onLeave);
                });
            },

            // ============================================
            // TASA DE CAMBIO
            // ============================================
            async obtenerTasaDolar() {
                if (this.tasaDolar !== null) return this.tasaDolar;
                try {
                    const resp = await fetch(CONFIG.EXCHANGE_API);
                    if (!resp.ok) throw new Error('API error');
                    const data = await resp.json();
                    if (data && data.rates && data.rates.VES) {
                        this.tasaDolar = data.rates.VES;
                        this.dom.tasaValor.textContent = this.tasaDolar.toFixed(2);
                        this.dom.dolarDiv.style.display = 'flex';
                        return this.tasaDolar;
                    } else {
                        throw new Error('Tasa no disponible');
                    }
                } catch (e) {
                    console.error('Error obteniendo tasa:', e);
                    this.dom.tasaValor.textContent = 'No disponible';
                    this.dom.dolarDiv.style.display = 'flex';
                    return null;
                }
            },

            // ============================================
            // CARRITO (con bump restaurado)
            // ============================================
            loadCarrito() {
                const data = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (data) {
                    try {
                        this.carrito = JSON.parse(data).filter(item => item && typeof item.id === 'number' && typeof item
                            .cantidad === 'number' && item.cantidad > 0);
                    } catch { this.carrito = []; }
                } else {
                    this.carrito = [];
                }
                this.actualizarCarrito();
            },

            saveCarrito() {
                localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.carrito));
            },

            getProducto(id) {
                return this.productos.find(p => p.id === id);
            },

            agregarAlCarrito(id) {
                const existente = this.carrito.find(item => item.id === id);
                if (existente) {
                    existente.cantidad += 1;
                } else {
                    this.carrito.push({ id, cantidad: 1 });
                }
                this.saveCarrito();
                this.actualizarCarrito();
                // Añadir bump
                this.dom.cartCount.classList.remove('cart-bump');
                void this.dom.cartCount.offsetWidth;
                this.dom.cartCount.classList.add('cart-bump');
            },

            eliminarDelCarrito(id) {
                this.carrito = this.carrito.filter(item => item.id !== id);
                this.saveCarrito();
                this.actualizarCarrito();
            },

            cambiarCantidad(id, delta) {
                const item = this.carrito.find(i => i.id === id);
                if (!item) return;
                const nueva = item.cantidad + delta;
                if (nueva <= 0) {
                    this.eliminarDelCarrito(id);
                } else {
                    item.cantidad = nueva;
                    this.saveCarrito();
                    this.actualizarCarrito();
                }
            },

            actualizarCarrito() {
                const totalItems = this.carrito.reduce((acc, i) => acc + i.cantidad, 0);
                this.dom.cartCount.textContent = totalItems;
                const container = this.dom.cartItems;
                container.innerHTML = '';
                let totalUSD = 0;
                this.carrito.forEach((item, index) => {
                    const producto = this.getProducto(item.id);
                    if (!producto) return;
                    const subtotal = producto.precio * item.cantidad;
                    totalUSD += subtotal;
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.style.animationDelay = `${index * 0.05}s`;
                    div.dataset.id = item.id;
                    div.innerHTML = `
                        <img src="${producto.imagen}" alt="${producto.nombre}" loading="lazy">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${producto.nombre}</div>
                            <div class="cart-item-price">$${producto.precio.toFixed(2)}</div>
                            <div class="cart-item-actions">
                                <button class="qty-btn" data-action="decr" data-id="${item.id}" aria-label="Disminuir cantidad">−</button>
                                <span class="qty-number">${item.cantidad}</span>
                                <button class="qty-btn" data-action="incr" data-id="${item.id}" aria-label="Aumentar cantidad">+</button>
                            </div>
                        </div>
                        <button class="remove-item" data-id="${item.id}" aria-label="Eliminar producto"><i class="fa-solid fa-trash"></i></button>
                    `;
                    container.appendChild(div);
                });
                Utils.animateNumber(this.dom.cartTotal, parseFloat(this.dom.cartTotal.textContent) || 0, totalUSD, 400);
                if (this.tasaDolar !== null && totalUSD > 0) {
                    const totalBs = totalUSD * this.tasaDolar;
                    this.dom.cartTotalBs.textContent = totalBs.toFixed(2);
                    this.dom.totalBsDiv.style.display = 'flex';
                } else {
                    this.dom.totalBsDiv.style.display = 'none';
                }
            },

            // ============================================
            // MODAL DE DETALLE
            // ============================================
            abrirDetalle(productoId) {
                const producto = this.getProducto(productoId);
                if (!producto) return;
                const cardOriginal = Utils.query(`.card[data-id="${productoId}"]`);
                if (!cardOriginal) return;

                const clone = cardOriginal.cloneNode(true);
                const descLarga = producto.descripcion_larga ?
                    `<div class="descripcion-larga">${producto.descripcion_larga}</div>` : '';
                const imagenesExtra = producto.imagenes_extra && producto.imagenes_extra.length ?
                    producto.imagenes_extra.map(img => `<img src="${img}" alt="${producto.nombre} - vista extra" loading="lazy">`).join('') :
                    '';
                const galeriaHtml = imagenesExtra ? `<div class="galeria-extra">${imagenesExtra}</div>` : '';

                const descEl = clone.querySelector('.card-desc');
                if (descEl) {
                    const parent = descEl.parentNode;
                    if (descLarga) {
                        const temp = document.createElement('div');
                        temp.innerHTML = descLarga;
                        parent.insertBefore(temp.firstElementChild, descEl.nextSibling);
                    }
                    if (galeriaHtml) {
                        const temp = document.createElement('div');
                        temp.innerHTML = galeriaHtml;
                        parent.insertBefore(temp.firstElementChild, descEl.nextSibling.nextSibling);
                    }
                }

                const footer = clone.querySelector('.card-footer');
                if (footer) {
                    const oldBtn = footer.querySelector('.btn-add');
                    if (oldBtn) {
                        const newBtn = document.createElement('button');
                        newBtn.className = 'btn-add';
                        newBtn.dataset.id = producto.id;
                        newBtn.setAttribute('aria-label', `Añadir ${producto.nombre}`);
                        newBtn.innerHTML = '<i class="fa-solid fa-plus"></i>';
                        if (!producto.disponible) {
                            newBtn.disabled = true;
                            newBtn.style.opacity = '0.5';
                            newBtn.style.cursor = 'not-allowed';
                        }
                        oldBtn.parentNode.replaceChild(newBtn, oldBtn);
                    }
                }

                this.dom.detalleContenido.innerHTML = '';
                this.dom.detalleContenido.appendChild(clone);
                this.configurarIntercambioImagenes(this.dom.detalleContenido);

                this.dom.detalleOverlay.classList.remove('visible');
                void this.dom.detalleOverlay.offsetWidth;
                this.dom.detalleOverlay.classList.add('visible');
                document.body.classList.add('modo-detalle');

                const wrapper = cardOriginal.closest('.card-wrapper');
                if (wrapper) wrapper.classList.add('activa');

                const newBtn = this.dom.detalleContenido.querySelector('.btn-add');
                if (newBtn && !newBtn.disabled) {
                    newBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = parseInt(newBtn.dataset.id);
                        const prod = this.getProducto(id);
                        if (prod) {
                            const img = this.dom.detalleContenido.querySelector('.card-img');
                            if (img) this.flyToCart(img, prod);
                            else this.agregarAlCarrito(id);
                        }
                    });
                }
                const modalCard = this.dom.detalleContenido.querySelector('.card');
                if (modalCard) this.applyTilt(modalCard, 8);
                document.body.style.overflow = 'hidden';
            },

            cerrarDetalle() {
                this.dom.detalleOverlay.classList.remove('visible');
                document.body.classList.remove('modo-detalle');
                document.body.style.overflow = '';
                Utils.queryAll('.card-wrapper.activa').forEach(w => w.classList.remove('activa'));
                setTimeout(() => { this.dom.detalleContenido.innerHTML = ''; }, 500);
            },

            configurarIntercambioImagenes(contenedor) {
                const portada = contenedor.querySelector('.card-img-container img');
                if (!portada) return;
                const miniaturas = contenedor.querySelectorAll('.galeria-extra img');
                if (!miniaturas.length) return;
                miniaturas.forEach(img => {
                    if (img.src === portada.src) img.classList.add('active-thumb');
                    img.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const urlPortada = portada.src;
                        const urlMini = img.src;
                        portada.src = urlMini;
                        img.src = urlPortada;
                        miniaturas.forEach(m => m.classList.remove('active-thumb'));
                        img.classList.add('active-thumb');
                        img.style.transition = 'transform 0.15s ease, filter 0.15s ease';
                        img.style.transform = 'scale(0.9)';
                        img.style.filter = 'brightness(1.5)';
                        setTimeout(() => {
                            img.style.transform = 'scale(1)';
                            img.style.filter = 'brightness(1)';
                        }, 200);
                        portada.style.transition = 'transform 0.2s ease';
                        portada.style.transform = 'scale(0.98)';
                        setTimeout(() => { portada.style.transform = 'scale(1)'; }, 200);
                    });
                });
            },

            // ============================================
            // FLY TO CART Y CONFETI
            // ============================================
            flyToCart(imgElement, producto) {
                if (!imgElement) return;
                const rect = imgElement.getBoundingClientRect();
                const clone = imgElement.cloneNode(true);
                clone.className = 'flying-img';
                clone.style.top = `${rect.top}px`;
                clone.style.left = `${rect.left}px`;
                clone.style.width = `${rect.width}px`;
                clone.style.height = `${rect.height}px`;
                clone.style.opacity = '1';
                document.body.appendChild(clone);
                const cartRect = this.dom.cartBtn.getBoundingClientRect();
                const destX = cartRect.left + cartRect.width / 2 - 30;
                const destY = cartRect.top + cartRect.height / 2 - 30;
                const startX = rect.left,
                    startY = rect.top;
                const startW = rect.width,
                    startH = rect.height;
                const endW = 20,
                    endH = 20;
                const duration = CONFIG.ANIMATION_DURATION;
                const startTime = performance.now();
                const anim = (timestamp) => {
                    const progress = Math.min((timestamp - startTime) / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    const cx = startX + (destX - startX) * ease;
                    const cy = startY + (destY - startY) * ease;
                    const cw = startW + (endW - startW) * ease;
                    const ch = startH + (endH - startH) * ease;
                    const op = 1 - ease * 0.5;
                    clone.style.top = `${cy}px`;
                    clone.style.left = `${cx}px`;
                    clone.style.width = `${cw}px`;
                    clone.style.height = `${ch}px`;
                    clone.style.opacity = op;
                    if (progress < 1) {
                        requestAnimationFrame(anim);
                    } else {
                        clone.remove();
                        this.agregarAlCarrito(producto.id);
                        this.lanzarConfeti(cartRect.left + cartRect.width / 2, cartRect.top + cartRect.height / 2);
                    }
                };
                requestAnimationFrame(anim);
            },

            lanzarConfeti(x, y) {
                const colores = ['#ff6a00', '#ff1a1a', '#ffdd00', '#00ff88', '#ff00ff', '#00ccff'];
                for (let i = 0; i < CONFIG.CONFETI_COUNT; i++) {
                    const el = document.createElement('div');
                    el.className = 'confeti';
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                    el.style.width = (Math.random() * 8 + 4) + 'px';
                    el.style.height = (Math.random() * 8 + 4) + 'px';
                    el.style.background = colores[Math.floor(Math.random() * colores.length)];
                    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    el.style.animationDuration = (Math.random() * 1 + 0.5) + 's';
                    el.style.transform = `rotate(${Math.random() * 360}deg)`;
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 2000);
                }
            },

            // ============================================
            // EVENTOS
            // ============================================
            initEvents() {
                this.dom.grid.addEventListener('click', (e) => {
                    const card = e.target.closest('.card');
                    if (!card) return;
                    if (e.target.closest('.btn-add') || e.target.closest('a')) return;
                    const id = parseInt(card.dataset.id);
                    if (id) this.abrirDetalle(id);
                });

                this.dom.grid.addEventListener('click', (e) => {
                    const btn = e.target.closest('.btn-add');
                    if (!btn || btn.disabled) return;
                    const id = parseInt(btn.dataset.id);
                    const prod = this.getProducto(id);
                    if (!prod) return;
                    if (!prod.disponible) {
                        alert('Este producto está agotado.');
                        return;
                    }
                    const img = document.getElementById(`img-${id}`);
                    if (img) this.flyToCart(img, prod);
                    else this.agregarAlCarrito(id);
                });

                this.dom.cartItems.addEventListener('click', (e) => {
                    const btn = e.target.closest('.qty-btn');
                    if (btn) {
                        const id = parseInt(btn.dataset.id);
                        const action = btn.dataset.action;
                        const delta = action === 'incr' ? 1 : -1;
                        this.cambiarCantidad(id, delta);
                        return;
                    }
                    const remove = e.target.closest('.remove-item');
                    if (remove) {
                        const id = parseInt(remove.dataset.id);
                        const itemEl = remove.closest('.cart-item');
                        if (itemEl) {
                            itemEl.classList.add('removing');
                            setTimeout(() => this.eliminarDelCarrito(id), 300);
                        } else {
                            this.eliminarDelCarrito(id);
                        }
                    }
                });

                this.dom.cartBtn.addEventListener('click', this.toggleSidebar.bind(this));
                this.dom.closeCart.addEventListener('click', this.toggleSidebar.bind(this));
                this.dom.cartOverlay.addEventListener('click', this.toggleSidebar.bind(this));

                this.dom.menuToggle.addEventListener('click', () => {
                    const open = this.dom.mainNav.classList.toggle('open');
                    this.dom.menuToggle.setAttribute('aria-expanded', open);
                    this.dom.menuToggle.innerHTML = open ? '<i class="fa-solid fa-xmark"></i>' :
                        '<i class="fa-solid fa-bars"></i>';
                });
                Utils.queryAll('#main-nav a').forEach(link => {
                    link.addEventListener('click', () => {
                        this.dom.mainNav.classList.remove('open');
                        this.dom.menuToggle.setAttribute('aria-expanded', 'false');
                        this.dom.menuToggle.innerHTML = '<i class="fa-solid fa-bars"></i>';
                    });
                });

                this.dom.whatsappBtn.addEventListener('click', () => {
                    if (!this.carrito.length) {
                        alert('Tu carrito está vacío.');
                        return;
                    }
                    let msg = '¡Hola! Quiero hacer el siguiente pedido:%0A';
                    let total = 0;
                    this.carrito.forEach(item => {
                        const prod = this.getProducto(item.id);
                        if (!prod) return;
                        const sub = prod.precio * item.cantidad;
                        total += sub;
                        msg += `- ${prod.nombre} x${item.cantidad} = $${sub.toFixed(2)}%0A`;
                    });
                    msg += `%0ATotal: $${total.toFixed(2)}`;
                    if (this.tasaDolar !== null && total > 0) {
                        msg += ` (Bs. ${(total * this.tasaDolar).toFixed(2)})`;
                    }
                    window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${msg}`, '_blank');
                });

                this.dom.detalleCerrar.addEventListener('click', () => this.cerrarDetalle());
                this.dom.detalleOverlay.addEventListener('click', (e) => {
                    if (e.target === this.dom.detalleOverlay) this.cerrarDetalle();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && this.dom.detalleOverlay.classList.contains('visible')) {
                        this.cerrarDetalle();
                    }
                });

                window.addEventListener('scroll', Utils.throttle(() => {
                    const scrollTop = window.scrollY;
                    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                    const progress = docHeight ? (scrollTop / docHeight) * 100 : 0;
                    document.getElementById('scroll-progress').style.width = progress + '%';
                }, 50));
            },

            toggleSidebar() {
                this.dom.cartSidebar.classList.toggle('open');
                this.dom.cartOverlay.classList.toggle('show');
                document.body.style.overflow = this.dom.cartSidebar.classList.contains('open') ? 'hidden' : '';
            },

            // ============================================
            // EFECTOS VISUALES
            // ============================================
            initParticles() {
                const canvas = document.createElement('canvas');
                canvas.style.cssText = 'position:fixed;top:0;left:0;z-index:-1;pointer-events:none;width:100%;height:100%;';
                document.body.prepend(canvas);
                const ctx = canvas.getContext('2d');
                let w, h, particles = [];
                const resize = () => {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                resize();
                class Particle {
                    constructor() {
                        this.x = Math.random() * w;
                        this.y = Math.random() * h;
                        this.size = Math.random() * 2 + 0.5;
                        this.speedX = (Math.random() - 0.5) * 0.4;
                        this.speedY = (Math.random() - 0.5) * 0.4;
                        this.opacity = Math.random() * 0.5 + 0.1;
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        if (this.x < 0 || this.x > w) this.speedX *= -1;
                        if (this.y < 0 || this.y > h) this.speedY *= -1;
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,106,0,${this.opacity})`;
                        ctx.fill();
                    }
                }
                for (let i = 0; i < 100; i++) particles.push(new Particle());
                const animate = () => {
                    ctx.clearRect(0, 0, w, h);
                    particles.forEach(p => { p.update();
                        p.draw(); });
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 150) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(255,106,0,${0.15 * (1 - dist / 150)})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }
                    requestAnimationFrame(animate);
                };
                animate();
            },

            initParallax() {
                const bg = this.dom.heroBg;
                if (!bg) return;
                document.addEventListener('mousemove', (e) => {
                    const x = (e.clientX / window.innerWidth - 0.5) * 20;
                    const y = (e.clientY / window.innerHeight - 0.5) * 20;
                    bg.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
                });
            },

            initScrollProgress() {
                // ya manejado en eventos
            }
        };

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        document.addEventListener('DOMContentLoaded', () => ProductManager.init());
    </script>
