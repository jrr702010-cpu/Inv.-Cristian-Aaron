<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Enlaces · X Posts</title>
<style>
  :root{
    --bg: #0b0d17;
    --bg2: #121425;
    --card: #171a2e;
    --card-hover: #1e2239;
    --border: #262a45;
    --text: #e8eaf6;
    --muted: #8b90b8;
    --accent: #7c5cff;
    --accent2: #21d4fd;
    --good: #2fd18a;
    --danger: #ff6b6b;
    --like: #f91880;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html{ scroll-behavior: smooth; }
  body{
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.18), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(33,212,253,.12), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px 80px;
    line-height: 1.5;
  }
  .wrap{ max-width: 1080px; margin: 0 auto; }

  /* ---------- HEADER ---------- */
  header{
    text-align: center;
    padding: 28px 20px 32px;
    margin-bottom: 26px;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: linear-gradient(160deg, rgba(124,92,255,.14), rgba(33,212,253,.06) 55%, transparent);
    backdrop-filter: blur(8px);
    position: relative;
    overflow: hidden;
  }
  header::after{
    content:""; position:absolute; inset:0;
    background: radial-gradient(600px 200px at 50% 0%, rgba(124,92,255,.25), transparent 70%);
    pointer-events:none;
  }
  header h1{
    font-size: clamp(1.5rem, 4vw, 2.3rem);
    font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(90deg, #fff, #c3b8ff 45%, #7ee7ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 10px;
  }
  header p{ color: var(--muted); font-size: .95rem; }
  .stats{
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    margin-top: 20px; position: relative; z-index: 1;
  }
  .pill{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 999px;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    font-size: .85rem; font-weight: 600;
  }
  .pill b{ color: var(--accent2); font-size: .95rem; }
  .pill.good b{ color: var(--good); }
  .pill.like b{ color: var(--like); }
  .pill.muted b{ color: var(--muted); }

  /* ---------- TOOLBAR ---------- */
  .toolbar{
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    margin-bottom: 14px;
    position: sticky; top: 12px; z-index: 50;
    padding: 12px; border-radius: 16px;
    background: rgba(11,13,23,.82);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
  }
  .search-box{ flex: 1 1 260px; position: relative; display: flex; align-items: center; }
  .search-box svg{
    position: absolute; left: 14px; width: 17px; height: 17px;
    stroke: var(--muted); fill: none; stroke-width: 2; pointer-events: none;
  }
  #search{
    width: 100%; padding: 12px 14px 12px 42px;
    border-radius: 11px; border: 1px solid var(--border);
    background: var(--bg2); color: var(--text); font-size: .92rem;
    font-family: inherit; outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  #search::placeholder{ color: #5f6490; }
  #search:focus{ border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,.18); }

  .btn{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px; border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    font-size: .88rem; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: all .18s; white-space: nowrap;
  }
  .btn:hover{ background: var(--card-hover); border-color: var(--accent); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }
  .btn.ok{ border-color: var(--good); color: var(--good); }
  .btn.danger{ border-color: rgba(255,107,107,.4); color: var(--danger); }
  .btn.danger:hover{ border-color: var(--danger); background: rgba(255,107,107,.1); }

  /* ---------- TABS ---------- */
  .tabs{
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 6px;
    border-radius: 14px;
    background: rgba(11,13,23,.6);
    border: 1px solid var(--border);
    width: fit-content;
    max-width: 100%;
  }
  .tab{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: .9rem; font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .tab:hover{ color: var(--text); background: rgba(255,255,255,.04); }
  .tab.active{
    background: linear-gradient(135deg, var(--accent), #5b8cff);
    color: #fff;
    box-shadow: 0 6px 18px -6px rgba(124,92,255,.6);
  }
  .tab.active[data-view="archived"]{
    background: linear-gradient(135deg, #2fd18a, #21a76a);
    box-shadow: 0 6px 18px -6px rgba(47,209,138,.6);
  }
  .tab .badge{
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 22px;
    padding: 0 7px;
    border-radius: 999px;
    background: rgba(255,255,255,.12);
    font-size: .75rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .tab.active .badge{ background: rgba(255,255,255,.28); }
  .tab[data-view="archived"] .badge{ color: var(--good); background: rgba(47,209,138,.15); }
  .tab.active[data-view="archived"] .badge{ color: #fff; background: rgba(255,255,255,.28); }

  /* ---------- LIST ---------- */
  .list{ display: flex; flex-direction: column; gap: 9px; }
  .item{
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-radius: 13px;
    background: var(--card); border: 1px solid var(--border);
    transition: all .16s ease;
    animation: fadeIn .25s ease both;
    flex-wrap: wrap;
  }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }
  .item:hover{
    background: var(--card-hover);
    border-color: rgba(124,92,255,.55);
    box-shadow: 0 6px 20px -10px rgba(124,92,255,.7);
  }

  .item.removing{
    animation: slideOut .38s ease forwards;
    pointer-events: none;
  }
  @keyframes slideOut{
    to{
      opacity: 0;
      transform: translateX(60px) scale(.96);
      filter: blur(3px);
    }
  }

  /* ---------- MARCA DE ARCHIVADO ---------- */
  .item.opened{
    border-left: 3px solid var(--good);
    background: linear-gradient(90deg, rgba(47,209,138,.08), var(--card) 45%);
  }
  .item.opened:hover{
    border-color: var(--good);
    box-shadow: 0 6px 20px -10px rgba(47,209,138,.55);
  }
  .item.opened .num{
    background: rgba(47,209,138,.18);
    border-color: rgba(47,209,138,.55);
    color: var(--good);
  }
  .item.opened .link{ color: var(--muted); opacity: .75; }
  .item.opened .link .handle{ color: var(--muted); }
  .check{
    flex: 0 0 auto; width: 20px; height: 20px;
    display: none; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--good);
    color: #042b1a; font-size: .75rem; font-weight: 900;
    box-shadow: 0 0 0 3px rgba(47,209,138,.18);
  }
  .item.opened .check{ display: flex; animation: pop .25s ease; }
  @keyframes pop{ 0%{ transform: scale(.4);} 60%{ transform: scale(1.15);} 100%{ transform: scale(1);} }

  .num{
    flex: 0 0 auto; min-width: 44px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 8px; border-radius: 9px;
    background: rgba(124,92,255,.14);
    border: 1px solid rgba(124,92,255,.3);
    color: #b9aaff; font-size: .78rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .link{
    flex: 1 1 auto; color: #c9d2ff; text-decoration: none;
    font-size: .9rem; word-break: break-all; transition: color .15s;
  }
  .link:hover{ color: var(--accent2); text-decoration: underline; }
  .link .handle{ color: #fff; font-weight: 700; }
  .link .id{ color: var(--muted); }

  /* ---------- BOTONES DE ACCIÓN ---------- */
  .action-btn{
    flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    width: 34px; height: 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: transparent; cursor: pointer;
    transition: all .16s; opacity: .55;
    font-family: inherit;
  }
  .item:hover .action-btn{ opacity: 1; }
  .action-btn svg{
    width: 15px; height: 15px; stroke: currentColor;
    fill: none; stroke-width: 2;
  }
  .action-btn:hover{
    background: rgba(124,92,255,.18);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .copy{ color: var(--text); }
  .copy.done svg{ stroke: var(--good); }
  .copy.done{ border-color: var(--good); }

  .like-btn{ color: var(--like); }
  .like-btn:hover{
    background: rgba(249,24,128,.14);
    border-color: var(--like);
  }
  .like-btn svg{ fill: none; stroke: var(--like); }
  .like-btn.liked svg{
    fill: var(--like);
    stroke: var(--like);
    animation: heartPop .4s ease;
  }
  .like-btn.liked{
    border-color: var(--like);
    background: rgba(249,24,128,.14);
    opacity: 1;
  }
  @keyframes heartPop{
    0%{ transform: scale(.5); }
    50%{ transform: scale(1.3); }
    100%{ transform: scale(1); }
  }

  .restore{ color: var(--accent2); }
  .restore:hover{
    background: rgba(33,212,253,.14);
    border-color: var(--accent2);
  }

  /* Eliminar (solo en archivados) */
  .delete-btn{ color: var(--danger); }
  .delete-btn:hover{
    background: rgba(255,107,107,.14);
    border-color: var(--danger);
  }
  .delete-btn svg{ fill: none; stroke: var(--danger); }

  /* ---------- ESTADOS ESPECIALES ---------- */
  .status-box{
    text-align: center; padding: 50px 24px;
    border: 1px dashed var(--border); border-radius: 16px;
    color: var(--muted);
  }
  .status-box code{
    background: rgba(124,92,255,.15); color: #c3b8ff;
    padding: 2px 8px; border-radius: 6px; font-size: .9em;
  }
  .status-box.error{ border-color: rgba(255,107,107,.4); color: #ffb0b0; }
  .status-box .hint{ margin-top: 12px; font-size: .88rem; line-height: 1.7; }
  .spinner{
    width: 32px; height: 32px; margin: 0 auto 16px;
    border: 3px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .empty{ display: none; }
  .empty.show{ display: block; }

  footer{ text-align: center; margin-top: 40px; color: #5f6490; font-size: .82rem; }

  ::-webkit-scrollbar{ width: 11px; }
  ::-webkit-scrollbar-track{ background: var(--bg); }
  ::-webkit-scrollbar-thumb{ background: #2c3154; border-radius: 99px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover{ background: var(--accent); }

  /* ---------- BOTÓN FLOTANTE SCROLL ---------- */
  .scroll-fab{
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(23, 26, 46, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--text);
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 8px 24px -8px rgba(0,0,0,.7),
      0 0 0 1px rgba(124,92,255,.12),
      inset 0 1px 0 rgba(255,255,255,.06);
    transition: all .22s ease;
  }
  .scroll-fab:hover{
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-3px) scale(1.05);
    box-shadow:
      0 14px 32px -8px rgba(124,92,255,.7),
      0 0 0 1px rgba(124,92,255,.35),
      inset 0 1px 0 rgba(255,255,255,.08);
  }
  .scroll-fab:active{ transform: translateY(-1px) scale(1); }
  .scroll-fab svg{
    width: 22px; height: 22px;
    stroke: currentColor; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .scroll-fab.to-top svg{ transform: rotate(180deg); }
  .scroll-fab.to-bottom svg{ transform: rotate(0deg); }
  .scroll-fab::before{
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--accent2);
    opacity: 0;
    transition: opacity .3s;
    animation: spin 1.4s linear infinite;
  }
  .scroll-fab.scrolling::before{ opacity: 1; }

  @media (max-width: 620px){
    body{ padding: 16px 10px 60px; }
    .item{ padding: 11px 12px; gap: 10px; }
    .num{ min-width: 38px; height: 27px; font-size: .72rem; }
    .link{ font-size: .8rem; }
    .action-btn{ width: 30px; height: 30px; }
    .action-btn svg{ width: 14px; height: 14px; }
    .btn{ padding: 11px 14px; font-size: .82rem; }
    .toolbar{ top: 8px; }
    .tabs{ width: 100%; }
    .tab{ flex: 1 1 auto; justify-content: center; padding: 9px 12px; font-size: .82rem; }
    .scroll-fab{ width: 46px; height: 46px; bottom: 16px; right: 16px; }
    .scroll-fab svg{ width: 20px; height: 20px; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
    .scroll-fab svg{ transition: none; }
    .scroll-fab::before{ animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Lista de Enlaces · X Posts</h1>
    <p>Colección numerada y navegable de publicaciones</p>
    <div class="stats">
      <span class="pill">Total: <b id="total">0</b></span>
      <span class="pill">Mostrando: <b id="shown">0</b></span>
      <span class="pill">Autores: <b id="authors">0</b></span>
      <span class="pill like">Likes: <b id="likeCount">0</b></span>
      <span class="pill muted">Eliminados: <b id="deletedCount">0</b></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input type="text" id="search" placeholder="Buscar por usuario, ID o número…" autocomplete="off">
    </div>
    <button class="btn" id="copyAll" title="Copiar todos los enlaces pendientes al portapapeles">
      <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2">
        <rect x="9" y="9" width="12" height="12" rx="2"/>
        <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
      </svg>
      Copiar
    </button>
    <button class="btn danger" id="clearMarks" title="Restaurar todo al estado inicial">
      <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2">
        <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      </svg>
      Restaurar todo
    </button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" data-view="pending" role="tab" aria-selected="true">
      📋 Pendientes
      <span class="badge" id="tabPending">0</span>
    </button>
    <button class="tab" data-view="archived" role="tab" aria-selected="false">
      📦 Archivados
      <span class="badge" id="tabArchived">0</span>
    </button>
  </div>

  <div id="status" class="status-box">
    <div class="spinner"></div>
    Cargando enlaces desde <code>enlaces.txt</code>…
  </div>

  <div class="list" id="list" style="display:none"></div>
  <div class="status-box empty" id="empty"></div>

  <footer>
    <p>Los enlaces se abren en una pestaña nueva · Tus marcas, likes y posición se guardan localmente en este navegador</p>
  </footer>

</div>

<button class="scroll-fab to-bottom" id="scrollFab"
        type="button" title="Ir al final" aria-label="Ir al final">
  <svg viewBox="0 0 24 24">
    <polyline points="6 9 12 15 18 9"/>
  </svg>
</button>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const ARCHIVO_ENLACES  = 'enlaces.txt';
const STORAGE_OPENED   = 'xlinks_opened_v1';
const STORAGE_LIKED    = 'xlinks_liked_v1';
const STORAGE_DELETED  = 'xlinks_deleted_v1';
const STORAGE_SCROLL   = 'xlinks_scroll_v1';

/* ============================================================
   ESTADO
   ============================================================ */
let LINKS = [];
let openedSet  = new Set();   // visitados (van a Archivados)
let likedSet   = new Set();   // con like dado
let deletedSet = new Set();   // eliminados de la vista (permanente hasta limpiar cache)
let currentView = 'pending';  // 'pending' | 'archived'

let scrollPositions = { pending: 0, archived: 0 };
let scrollSaveTimer = null;

/* ============================================================
   PERSISTENCIA
   ============================================================ */
function cargarSets(){
  try {
    const a = localStorage.getItem(STORAGE_OPENED);
    const c = localStorage.getItem(STORAGE_LIKED);
    const d = localStorage.getItem(STORAGE_DELETED);
    const s = localStorage.getItem(STORAGE_SCROLL);
    openedSet  = new Set(a ? JSON.parse(a) : []);
    likedSet   = new Set(c ? JSON.parse(c) : []);
    deletedSet = new Set(d ? JSON.parse(d) : []);
    scrollPositions = s ? JSON.parse(s) : { pending: 0, archived: 0 };
    if (typeof scrollPositions.pending  !== 'number') scrollPositions.pending  = 0;
    if (typeof scrollPositions.archived !== 'number') scrollPositions.archived = 0;
  } catch(e){
    openedSet = new Set(); likedSet = new Set(); deletedSet = new Set();
    scrollPositions = { pending: 0, archived: 0 };
  }
}
function guardarSet(key, set){
  try { localStorage.setItem(key, JSON.stringify([...set])); } catch(e){}
}
function guardarScrollPositions(){
  try { localStorage.setItem(STORAGE_SCROLL, JSON.stringify(scrollPositions)); } catch(e){}
}

/* ============================================================
   CARGA DEL ARCHIVO EXTERNO
   ============================================================ */
async function cargarEnlaces(){
  const res = await fetch(ARCHIVO_ENLACES, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const txt = await res.text();
  return txt.split(/\r?\n/)
    .map(l => l.trim())
    .filter(l => l && !l.startsWith('#') && /^https?:\/\//i.test(l));
}

/* ============================================================
   UTILIDADES
   ============================================================ */
const handleOf = u => (u.match(/x\.com\/([^/]+)\//) || [,''])[1];
const idOf     = u => (u.match(/status\/(\d+)/)    || [,''])[1];

/* Un item es "visible" si no está eliminado de la vista */
const esVisible = u => !deletedSet.has(u);

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
function render(){
  const listEl  = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const statusEl= document.getElementById('status');

  listEl.innerHTML = '';

  if (!LINKS.length){
    statusEl.style.display = 'none';
    emptyEl.classList.add('show');
    emptyEl.textContent = 'El archivo enlaces.txt está vacío.';
    return;
  }

  statusEl.style.display = 'none';

  const items = LINKS
    .map((url, i) => ({ url, i }))
    .filter(({ url }) => {
      if (!esVisible(url)) return false;
      const isOpened = openedSet.has(url);
      return currentView === 'pending' ? !isOpened : isOpened;
    });

  if (!items.length){
    listEl.style.display = 'none';
    emptyEl.classList.add('show');
    if (currentView === 'pending'){
      emptyEl.innerHTML = '🎉 <strong>¡Felicidades!</strong><br>No quedan enlaces pendientes por visitar.';
    } else {
      emptyEl.innerHTML = '📦 La carpeta de archivados está vacía.<br>Los enlaces que visites aparecerán aquí.';
    }
    document.getElementById('shown').textContent = 0;
    actualizarContadores();
    actualizarTabs();
    return;
  }

  emptyEl.classList.remove('show');
  listEl.style.display = '';

  const frag = document.createDocumentFragment();

  items.forEach(({ url, i }) => {
    const handle  = handleOf(url);
    const id      = idOf(url);
    const abierto = openedSet.has(url);
    const gustado = likedSet.has(url);

    const row = document.createElement('div');
    row.className = 'item' + (abierto ? ' opened' : '');
    row.dataset.search = (url + ' ' + handle + ' ' + (i + 1)).toLowerCase();
    row.dataset.url = url;
    row.dataset.id  = id;

    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';

    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = i + 1;

    const a = document.createElement('a');
    a.className = 'link';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = url;
    a.innerHTML =
      '<span class="handle">@' + handle + '</span>' +
      '<span class="id">/status/' + id + '</span>';
    a.addEventListener('click', () => marcarAbierto(url, row));

    // -------- Botón "Like" --------
    const likeBtn = document.createElement('button');
    likeBtn.className = 'like-btn action-btn' + (gustado ? ' liked' : '');
    likeBtn.type = 'button';
    likeBtn.dataset.id = id;
    likeBtn.title = gustado ? 'Ya diste me gusta' : 'Dar me gusta en X';
    likeBtn.setAttribute('aria-label', 'Dar me gusta');
    likeBtn.innerHTML =
      '<svg viewBox="0 0 24 24">' +
        '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>' +
      '</svg>';
    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      abrirIntentLike(id, likeBtn);
    });

    // -------- Botón copiar --------
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy action-btn';
    copyBtn.type = 'button';
    copyBtn.title = 'Copiar enlace';
    copyBtn.setAttribute('aria-label', 'Copiar enlace');
    copyBtn.innerHTML =
      '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/>' +
      '<path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    copyBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try { await navigator.clipboard.writeText(url); }
      catch(_){
        const ta = document.createElement('textarea');
        ta.value = url; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      copyBtn.classList.add('done');
      setTimeout(() => copyBtn.classList.remove('done'), 1200);
    });

    // -------- Botones específicos de archivados --------
    let restoreBtn = null;
    let deleteBtn  = null;

    if (currentView === 'archived'){
      // Restaurar (volver a pendientes)
      restoreBtn = document.createElement('button');
      restoreBtn.className = 'restore action-btn';
      restoreBtn.type = 'button';
      restoreBtn.title = 'Mover de vuelta a pendientes';
      restoreBtn.setAttribute('aria-label', 'Restaurar');
      restoreBtn.innerHTML =
        '<svg viewBox="0 0 24 24">' +
          '<path d="M3 12a9 9 0 1 0 3-6.7"/>' +
          '<polyline points="3 4 3 9 8 9"/>' +
        '</svg>';
      restoreBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        restaurar(url);
      });

      // Eliminar de la vista (permanente hasta vaciar cache)
      deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn action-btn';
      deleteBtn.type = 'button';
      deleteBtn.title = 'Eliminar de la vista (no afecta al archivo original)';
      deleteBtn.setAttribute('aria-label', 'Eliminar de la vista');
      deleteBtn.innerHTML =
        '<svg viewBox="0 0 24 24">' +
          '<path d="M3 6h18"/>' +
          '<path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>' +
          '<path d="M10 11v6"/>' +
          '<path d="M14 11v6"/>' +
          '<path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>' +
        '</svg>';
      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        eliminarDeVista(url, row);
      });
    }

    // Orden de botones
    if (currentView === 'archived'){
      row.append(check, num, a, likeBtn, copyBtn, restoreBtn, deleteBtn);
    } else {
      row.append(check, num, a, likeBtn, copyBtn);
    }

    frag.appendChild(row);
  });

  listEl.appendChild(frag);

  document.getElementById('total').textContent   = LINKS.length;
  document.getElementById('authors').textContent = new Set(LINKS.map(handleOf)).size;
  actualizarContadores();
  actualizarTabs();
  aplicarBusqueda();
}

/* ============================================================
   ACTUALIZAR TABS Y CONTADORES
   ============================================================ */
function actualizarTabs(){
  const pendientes = LINKS.filter(u => !openedSet.has(u) && esVisible(u)).length;
  const archivados = LINKS.filter(u =>  openedSet.has(u) && esVisible(u)).length;
  document.getElementById('tabPending').textContent  = pendientes;
  document.getElementById('tabArchived').textContent = archivados;
}

function actualizarContadores(){
  const likes = LINKS.filter(u => likedSet.has(u) && esVisible(u)).length;
  const del   = LINKS.filter(u => deletedSet.has(u)).length;
  document.getElementById('likeCount').textContent    = likes;
  document.getElementById('deletedCount').textContent = del;
}

/* ============================================================
   SCROLL PERSISTENTE POR VISTA
   ============================================================ */
function guardarScrollActual(){
  scrollPositions[currentView] = window.scrollY || 0;
  guardarScrollPositions();
}

function restaurarScrollDeVistaActual(){
  const pos = scrollPositions[currentView] || 0;
  // Doble rAF para asegurar que el layout esté listo tras el render
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      window.scrollTo({ top: pos, behavior: 'auto' });
    });
  });
}

function activarScrollListener(){
  window.addEventListener('scroll', () => {
    clearTimeout(scrollSaveTimer);
    scrollSaveTimer = setTimeout(() => {
      scrollPositions[currentView] = window.scrollY || 0;
      guardarScrollPositions();
    }, 200);
  }, { passive: true });

  // Guardar antes de salir de la página (por si cierra la pestaña)
  window.addEventListener('beforeunload', guardarScrollActual);
  // Guardar cuando la pestaña pierde visibilidad (cambio de pestaña del navegador)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) guardarScrollActual();
  });
}

/* ============================================================
   CAMBIO DE VISTA (TABS) con preservación de scroll
   ============================================================ */
function activarTabs(){
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const nuevaVista = tab.dataset.view;
      if (nuevaVista === currentView) return;

      // 1. Guardamos el scroll de la vista actual antes de cambiar
      guardarScrollActual();

      // 2. Cambiamos el estado
      currentView = nuevaVista;

      // 3. Actualizamos clases de las tabs
      document.querySelectorAll('.tab').forEach(t => {
        const active = t.dataset.view === currentView;
        t.classList.toggle('active', active);
        t.setAttribute('aria-selected', active ? 'true' : 'false');
      });

      // 4. Renderizamos la nueva vista
      render();

      // 5. Restauramos la posición guardada de la nueva vista
      restaurarScrollDeVistaActual();
    });
  });
}

/* ============================================================
   MARCAR COMO ABIERTO (mueve de pendientes a archivados)
   ============================================================ */
function marcarAbierto(url, row){
  if (openedSet.has(url)) return;
  openedSet.add(url);
  guardarSet(STORAGE_OPENED, openedSet);

  row.classList.add('opened');
  actualizarContadores();
  actualizarTabs();

  if (currentView === 'pending'){
    setTimeout(() => {
      row.classList.add('removing');
      setTimeout(() => render(), 380);
    }, 550);
  }
}

/* ============================================================
   RESTAURAR (mueve de archivados a pendientes)
   ============================================================ */
function restaurar(url){
  if (!openedSet.has(url)) return;
  openedSet.delete(url);
  guardarSet(STORAGE_OPENED, openedSet);
  actualizarContadores();
  actualizarTabs();

  const row = document.querySelector(`.item[data-url="${CSS.escape(url)}"]`);
  if (row){
    row.classList.add('removing');
    setTimeout(() => render(), 380);
  } else {
    render();
  }
}

/* ============================================================
   ELIMINAR DE LA VISTA (solo en archivados)
   ============================================================
   El enlace sigue en enlaces.txt, solo lo ocultamos del render.
   Se revierte vaciando el localStorage (o "Restaurar todo").
   ============================================================ */
function eliminarDeVista(url, row){
  if (deletedSet.has(url)) return;
  deletedSet.add(url);
  guardarSet(STORAGE_DELETED, deletedSet);
  actualizarContadores();
  actualizarTabs();

  if (row){
    row.classList.add('removing');
    setTimeout(() => render(), 380);
  } else {
    render();
  }
}

/* ============================================================
   WEB INTENT DE LIKE
   ============================================================ */
function abrirIntentLike(id, btn){
  const w = 550, h = 420;
  const left = Math.max(0, (screen.width  - w) / 2);
  const top  = Math.max(0, (screen.height - h) / 2);
  const url  = `https://x.com/intent/like?tweet_id=${id}`;

  window.open(url, 'x-like',
    `width=${w},height=${h},left=${left},top=${top},scrollbars=yes,resizable=yes`);

  setTimeout(() => {
    const url2 = LINKS.find(u => idOf(u) === id);
    if (url2 && !likedSet.has(url2)){
      likedSet.add(url2);
      guardarSet(STORAGE_LIKED, likedSet);
      btn.classList.add('liked');
      btn.title = 'Ya diste me gusta';
      actualizarContadores();
    }
  }, 1500);
}

/* ============================================================
   BUSCADOR
   ============================================================ */
function aplicarBusqueda(){
  const searchEl = document.getElementById('search');
  const emptyEl  = document.getElementById('empty');
  const q = searchEl.value.trim().toLowerCase();

  let visible = 0;
  document.querySelectorAll('.item').forEach(el => {
    const match = !q || el.dataset.search.includes(q);
    el.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('shown').textContent = visible;

  const hayItemsEnVista = document.querySelectorAll('.item').length > 0;
  if (hayItemsEnVista && visible === 0){
    emptyEl.classList.add('show');
    emptyEl.textContent = '🔍 No se encontraron enlaces para esa búsqueda en esta vista.';
  } else if (hayItemsEnVista){
    emptyEl.classList.remove('show');
  }
}

function activarBuscador(){
  document.getElementById('search').addEventListener('input', aplicarBusqueda);
}

/* ============================================================
   ACCIONES GLOBALES
   ============================================================ */
function activarCopiarTodo(){
  document.getElementById('copyAll').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    const original = btn.innerHTML;
    const pendientes = LINKS.filter(u => !openedSet.has(u) && esVisible(u));
    const texto = pendientes.join('\n');

    if (!texto){
      btn.classList.add('ok');
      btn.innerHTML = '✓ Nada que copiar';
      setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = original; }, 1800);
      return;
    }

    try { await navigator.clipboard.writeText(texto); }
    catch(_){
      const ta = document.createElement('textarea');
      ta.value = texto; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    btn.classList.add('ok');
    btn.innerHTML = `✓ ${pendientes.length} copiados`;
    setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = original; }, 1800);
  });
}

function activarRestaurarTodo(){
  document.getElementById('clearMarks').addEventListener('click', () => {
    const total = openedSet.size + likedSet.size + deletedSet.size;
    if (!total) return;
    if (!confirm(
      'Esto restaurará TODO al estado inicial:\n' +
      '• Los archivados volverán a Pendientes\n' +
      '• Se olvidarán los likes\n' +
      '• Los eliminados volverán a aparecer\n\n' +
      'El archivo enlaces.txt no se modifica.\n\n¿Continuar?'
    )) return;

    openedSet.clear();
    likedSet.clear();
    deletedSet.clear();
    guardarSet(STORAGE_OPENED, openedSet);
    guardarSet(STORAGE_LIKED, likedSet);
    guardarSet(STORAGE_DELETED, deletedSet);

    if (currentView === 'archived'){
      currentView = 'pending';
      document.querySelectorAll('.tab').forEach(t => {
        const active = t.dataset.view === 'pending';
        t.classList.toggle('active', active);
        t.setAttribute('aria-selected', active ? 'true' : 'false');
      });
    }

    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

/* ============================================================
   BOTÓN FLOTANTE DE SCROLL
   ============================================================ */
function activarScrollFab(){
  const fab = document.getElementById('scrollFab');
  if (!fab) return;

  let fabTimer = null;

  function actualizarEstado(){
    const scrollY = window.scrollY;
    const maxScroll = Math.max(
      0,
      document.documentElement.scrollHeight - window.innerHeight
    );

    if (maxScroll < 200){
      fab.style.display = 'none';
      return;
    }
    fab.style.display = '';

    const enMitadSuperior = scrollY < maxScroll / 2;

    if (enMitadSuperior){
      fab.classList.remove('to-top');
      fab.classList.add('to-bottom');
      fab.title = 'Ir al final';
      fab.setAttribute('aria-label', 'Ir al final');
    } else {
      fab.classList.remove('to-bottom');
      fab.classList.add('to-top');
      fab.title = 'Ir al principio';
      fab.setAttribute('aria-label', 'Ir al principio');
    }
  }

  fab.addEventListener('click', () => {
    const scrollY = window.scrollY;
    const maxScroll = Math.max(
      0,
      document.documentElement.scrollHeight - window.innerHeight
    );
    const irAlFondo = scrollY < maxScroll / 2;

    fab.classList.add('scrolling');
    clearTimeout(fabTimer);
    fabTimer = setTimeout(() => fab.classList.remove('scrolling'), 700);

    window.scrollTo({
      top: irAlFondo ? document.documentElement.scrollHeight : 0,
      behavior: 'smooth'
    });
  });

  window.addEventListener('scroll', actualizarEstado, { passive: true });
  window.addEventListener('resize', actualizarEstado);

  actualizarEstado();
  requestAnimationFrame(actualizarEstado);
}

function activarScrollFabActualizado(){
  const fab = document.getElementById('scrollFab');
  if (!fab) return;
  window.dispatchEvent(new Event('resize'));
}

/* ============================================================
   ARRANQUE
   ============================================================ */
(async function init(){
  cargarSets();
  activarTabs();
  activarBuscador();
  activarCopiarTodo();
  activarRestaurarTodo();
  activarScrollFab();
  activarScrollListener();

  try {
    LINKS = await cargarEnlaces();
    render();
    activarScrollFabActualizado();
    // Restaurar la posición guardada tras el primer render
    restaurarScrollDeVistaActual();
  } catch(err){
    const st = document.getElementById('status');
    st.className = 'status-box error';
    st.innerHTML = `
      <p><strong>No se pudo cargar la lista de enlaces</strong></p>
      <p style="margin-top:10px;font-size:.9rem">${err.message}</p>
      <div class="hint">
        Asegúrate de que <code>${ARCHIVO_ENLACES}</code> esté en la misma carpeta que este HTML.<br>
        Si abriste el archivo con doble clic (<code>file://</code>), el navegador bloquea <code>fetch()</code>.
        Sirve la carpeta con un servidor local, por ejemplo:<br>
        <code>python -m http.server 8000</code> y visita <code>http://localhost:8000</code>
      </div>`;
  }
})();
</script>
