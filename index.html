<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inversiones Cristian Aaron C.A | PRO Experience</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ============================================
               VARIABLES Y RESET
            ============================================ */
        :root {
            --primary-color: #ff6a00;
            --secondary-color: #ff1a1a;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(25, 25, 25, 0.6);
            --text-light: #ffffff;
            --text-muted: #888888;
            --font-heading: 'Oswald', sans-serif;
            --font-body: 'Poppins', sans-serif;
            --transition-smooth: cubic-bezier(0.25, 1, 0.5, 1);
            --transition-bounce: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--dark-bg);
            color: var(--text-light);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* ============================================
               EFECTOS AMBIENTALES DE FONDO
            ============================================ */
        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            will-change: transform;
        }

        .light-1 {
            width: 400px;
            height: 400px;
            background: var(--primary-color);
            top: -100px;
            left: -100px;
        }

        .light-2 {
            width: 500px;
            height: 500px;
            background: var(--secondary-color);
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(50px, 50px) scale(1.2);
            }
        }

        /* ============================================
               HEADER ESTÁTICO (sin animaciones)
            ============================================ */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 106, 0, 0.2);
            /* Sin transition para que sea estático */
        }

        .logo h1 {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color);
        }

        /* Menú de navegación */
        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            transition: all 0.4s ease;
        }

        .hover-underline {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            position: relative;
            padding-bottom: 5px;
        }

        .hover-underline::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
            box-shadow: 0 0 8px var(--primary-color);
        }

        .hover-underline:hover::after {
            width: 100%;
        }

        /* Botón menú hamburguesa (solo móvil) */
        #menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 2rem;
            cursor: pointer;
            padding: 0 10px;
            transition: color 0.3s;
        }

        #menu-toggle:hover {
            color: var(--primary-color);
        }

        /* Icono carrito */
        .cart-icon {
            font-size: 1.5rem;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .cart-icon:hover {
            color: var(--primary-color);
            filter: drop-shadow(0 0 8px var(--primary-color));
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -12px;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 106, 0, 0.6);
            transition: transform 0.2s var(--transition-bounce);
            will-change: transform;
        }

        .cart-bump {
            animation: bump 0.3s var(--transition-bounce);
        }

        @keyframes bump {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.5);
            }
            100% {
                transform: scale(1);
            }
        }

        /* ============================================
               HERO SECTION
            ============================================ */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('Fondo.jpg') center/cover;
            filter: brightness(0.4) contrast(1.2);
            transform: scale(1.1);
            animation: panBg 20s infinite alternate linear;
            will-change: transform;
        }

        @keyframes panBg {
            from {
                transform: scale(1.1) translate(0, 0);
            }
            to {
                transform: scale(1.2) translate(-2%, 2%);
            }
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        /* ============================================
           LOGOTIPO CON DESTELLO ADAPTADO A LA FORMA DEL PNG
        ============================================ */
        .hero-logo {
            width: 200px;
            height: 200px;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(255, 106, 0, 0.6)) drop-shadow(0 0 40px rgba(255, 26, 26, 0.4));
            animation: pulse-glow 2.5s infinite alternate;
            will-change: transform, filter;
            transition: transform 0.3s ease;
            cursor: default;
        }

        .hero-logo:hover {
            transform: rotate(5deg) scale(1.05);
        }

        @keyframes pulse-glow {
            from {
                filter: drop-shadow(0 0 15px rgba(255, 106, 0, 0.4)) drop-shadow(0 0 30px rgba(255, 26, 26, 0.2));
                transform: scale(1);
            }
            to {
                filter: drop-shadow(0 0 30px rgba(255, 106, 0, 0.8)) drop-shadow(0 0 60px rgba(255, 26, 26, 0.6)) drop-shadow(0 0 80px rgba(255, 106, 0, 0.4));
                transform: scale(1.03);
            }
        }

        /* Título con jerarquía: "INVERSIONES" más pequeño */
        .hero-title {
            font-family: var(--font-heading);
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero-title .small {
            font-size: 3.5rem;
            display: block;
            letter-spacing: 4px;
        }

        .hero-title .big {
            font-size: 6rem;
            display: block;
        }

        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #ddd;
        }

        /* Contacto WhatsApp en el Hero */
        .contacto-whatsapp {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .contacto-whatsapp a {
            color: #25D366;
            font-size: 1.1rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid rgba(37, 211, 102, 0.3);
            transition: all 0.3s ease;
        }

        .contacto-whatsapp a:hover {
            background: rgba(37, 211, 102, 0.15);
            border-color: #25D366;
            transform: scale(1.05);
        }

        .contacto-whatsapp a i {
            font-size: 1.3rem;
        }

        /* Texto Glitch + Neon (solo la parte grande) */
        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 var(--secondary-color);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 var(--primary-color);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim2 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(15px, 9999px, 44px, 0); }
            20% { clip: rect(80px, 9999px, 20px, 0); }
            40% { clip: rect(30px, 9999px, 90px, 0); }
            60% { clip: rect(50px, 9999px, 10px, 0); }
            80% { clip: rect(100px, 9999px, 60px, 0); }
            100% { clip: rect(10px, 9999px, 80px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            20% { clip: rect(20px, 9999px, 50px, 0); }
            40% { clip: rect(80px, 9999px, 30px, 0); }
            60% { clip: rect(10px, 9999px, 70px, 0); }
            80% { clip: rect(50px, 9999px, 20px, 0); }
            100% { clip: rect(90px, 9999px, 40px, 0); }
        }

        .neon-text {
            color: transparent;
            -webkit-text-stroke: 2px var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color), 0 0 40px var(--secondary-color);
            animation: neonFlicker 3s infinite alternate;
        }

        @keyframes neonFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color), 0 0 40px var(--secondary-color);
            }
            20%, 24%, 55% {
                text-shadow: none;
            }
        }

        /* Botón Neón (con efecto de borde animado) */
        .btn-neon {
            position: relative;
            display: inline-block;
            padding: 15px 40px;
            color: var(--primary-color);
            font-weight: bold;
            font-family: var(--font-heading);
            text-decoration: none;
            text-transform: uppercase;
            font-size: 1.2rem;
            overflow: hidden;
            letter-spacing: 2px;
            transition: 0.2s;
            background: transparent;
            border: none;
            cursor: pointer;
            margin-top: 30px;
        }

        .btn-neon:hover {
            color: #fff;
            background: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color), 0 0 40px var(--primary-color), 0 0 80px var(--primary-color);
            transition-delay: 0.2s;
        }

        .btn-neon span {
            position: absolute;
            display: block;
        }

        .btn-neon span:nth-child(1) {
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-color));
            animation: btn-anim1 1s linear infinite;
        }

        @keyframes btn-anim1 {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .btn-neon span:nth-child(2) {
            top: -100%;
            right: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, transparent, var(--primary-color));
            animation: btn-anim2 1s linear infinite;
            animation-delay: 0.25s;
        }

        @keyframes btn-anim2 {
            0% { top: -100%; }
            50%, 100% { top: 100%; }
        }

        .btn-neon span:nth-child(3) {
            bottom: 0;
            right: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(270deg, transparent, var(--primary-color));
            animation: btn-anim3 1s linear infinite;
            animation-delay: 0.5s;
        }

        @keyframes btn-anim3 {
            0% { right: -100%; }
            50%, 100% { right: 100%; }
        }

        .btn-neon span:nth-child(4) {
            bottom: -100%;
            left: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(360deg, transparent, var(--primary-color));
            animation: btn-anim4 1s linear infinite;
            animation-delay: 0.75s;
        }

        @keyframes btn-anim4 {
            0% { bottom: -100%; }
            50%, 100% { bottom: 100%; }
        }

        /* ============================================
               FILTROS (con efecto tilt y destello)
               NOTA: Los botones se generan dinámicamente en JS
            ============================================ */
        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            padding: 50px 20px 30px;
            position: relative;
            z-index: 10;
        }

        .filter-btn {
            background: transparent;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.4s var(--transition-smooth);
            backdrop-filter: blur(5px);
            will-change: transform, box-shadow;
            font-size: 0.85rem;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .filter-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            transform: skewX(-30deg);
            transition: left 0.6s ease;
            pointer-events: none;
        }

        .filter-btn:hover::before {
            left: 100%;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px rgba(255, 106, 0, 0.5);
            transform: translateY(-3px);
        }

        .filter-btn:active {
            transform: scale(0.95);
        }

        /* ============================================
               CATÁLOGO / GRID
            ============================================ */
        .catalog {
            padding: 20px 5%;
            min-height: 60vh;
            position: relative;
            z-index: 10;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
            perspective: 1000px;
        }

        .card-wrapper {
            perspective: 1000px;
            transform-style: preserve-3d;
            will-change: transform;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            overflow: hidden;
            transition: box-shadow 0.3s ease, transform 0.2s ease, filter 0.4s ease, opacity 0.4s ease;
            will-change: transform, box-shadow, filter, opacity;
            position: relative;
            transform-style: preserve-3d;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card-img-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 20px 20px 0 0;
            transform: translateZ(40px);
            will-change: transform;
            flex-shrink: 0;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s var(--transition-smooth), filter 0.6s ease;
            will-change: transform;
        }

        .card:hover .card-img {
            transform: scale(1.08);
            filter: contrast(1.1);
        }

        /* Etiqueta de "Agotado" */
        .agotado-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 0, 0, 0.9);
            color: #fff;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            z-index: 5;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        .card-content {
            padding: 25px 25px 15px;
            display: flex;
            flex-direction: column;
            transform: translateZ(30px);
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-family: var(--font-heading);
            letter-spacing: 1px;
            position: relative;
            display: inline-block;
            pointer-events: none;
        }

        .card-title::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-color);
            transition: width 0.4s ease;
            box-shadow: 0 0 8px var(--primary-color);
        }

        .card:hover .card-title::after {
            width: 100%;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            transform: translateZ(50px);
            flex-shrink: 0;
        }

        .price {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--text-light);
            text-shadow: 0 0 10px rgba(255, 106, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .price span {
            color: var(--primary-color);
            font-size: 1rem;
            vertical-align: top;
        }

        .btn-add {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(255, 106, 0, 0.4);
            transition: all 0.3s var(--transition-bounce);
            overflow: hidden;
            position: relative;
            will-change: transform, box-shadow;
            pointer-events: auto;
            flex-shrink: 0;
        }

        .btn-add::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transform: skewX(-45deg);
            transition: 0.5s;
        }

        .btn-add:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 8px 25px rgba(255, 106, 0, 0.7);
        }

        .btn-add:hover::before {
            left: 100%;
        }

        .btn-add:active {
            transform: scale(0.9);
        }

        /* ============================================
               MODO DETALLE - OVERLAY Y TARJETA AMPLIADA
            ============================================ */
        .detalle-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .detalle-overlay.visible {
            display: flex;
            opacity: 1;
        }

        .detalle-contenedor {
            background: var(--card-bg);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .detalle-overlay.visible .detalle-contenedor {
            transform: scale(1);
        }

        .detalle-cerrar {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 2.5rem;
            cursor: pointer;
            transition: transform 0.3s ease, color 0.3s ease;
            z-index: 10;
            line-height: 1;
        }

        .detalle-cerrar:hover {
            transform: rotate(90deg);
            color: var(--secondary-color);
        }

        /* Estilos para la tarjeta dentro del detalle */
        .detalle-contenedor .card {
            background: transparent;
            backdrop-filter: none;
            box-shadow: none;
            border: none;
            cursor: default;
            transform: none !important;
            transition: none !important;
        }

        .detalle-contenedor .card:hover {
            box-shadow: none;
            transform: none !important;
        }

        .detalle-contenedor .card-img-container {
            height: 400px;
            border-radius: 16px 16px 0 0;
        }

        .detalle-contenedor .card-desc {
            -webkit-line-clamp: unset;
            max-height: none;
            color: var(--text-light);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .detalle-contenedor .descripcion-larga,
        .detalle-contenedor .galeria-extra {
            display: block !important;
            opacity: 1 !important;
        }

        .detalle-contenedor .galeria-extra {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin-top: 20px;
            padding: 15px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .detalle-contenedor .galeria-extra img {
            height: 80px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            border: 2px solid transparent;
        }

        .detalle-contenedor .galeria-extra img:hover {
            transform: scale(1.05);
            border-color: var(--primary-color);
        }

        .detalle-contenedor .expand-indicator {
            display: none !important;
        }

        /* Ocultar elementos innecesarios en el detalle */
        .detalle-contenedor .card-title::after {
            display: none;
        }

        /* ============================================
               ESTADO DEL GRID CUANDO EL DETALLE ESTÁ ABIERTO
            ============================================ */

                        { id: 2, nombre: "Urban Classic", categoria: "panes", precio: 5.00, descripcion: "Carne de res 150g, lechuga, tomate fresco, pepinillos, cebolla morada y salsa tradicional.", descripcion_larga: "La hamburguesa clásica...", imagen: "https://images.unsplash.com/photo-1572802419224-296b0aeee0d9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true },
                        { id: 3, nombre: "Crispy Inferno", categoria: "panes", precio: 6.50, descripcion: "Pechuga de pollo extra crujiente picante, ensalada coleslaw, pepinillos y salsa fuego.", descripcion_larga: "Para los amantes del picante...", imagen: "https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true },
                        { id: 4, nombre: "Monster Dog", categoria: "charcuteria", precio: 4.50, descripcion: "Salchicha polaca gigante, lluvia de papas, queso fundido, tocineta, repollo y todas las salsas extremas.", descripcion_larga: "El hot dog más extremo...", imagen: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true },
                        { id: 5, nombre: "Chori-Perro Supremo", categoria: "charcuteria", precio: 5.50, descripcion: "Pan artesanal, chorizo ahumado, pico de gallo, guacamole y queso mozzarella gratinado a soplete.", descripcion_larga: "Una fusión mexicana-americana...", imagen: "https://images.unsplash.com/photo-1590165482129-1b8b27698780?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true },
                        { id: 6, nombre: "Coca-Cola 1.5L Hielo", categoria: "bebidas", precio: 2.50, descripcion: "Refresco helado a punto de congelación.", descripcion_larga: "La clásica Coca-Cola servida bien fría...", imagen: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80", imagenes_extra: [], cantidad_por_paquete: 1, tipo_producto: "", disponible: true }
                    ];
                } finally {
                    generarFiltros();
                    renderProductos('all');
                    initPersistentTilt();
                    await obtenerTasaDolar();
                }
            }

            // ============================================
            // RENDERIZAR PRODUCTOS (con soporte para disponibilidad)
            // ============================================
            function renderProductos(filtro = 'all') {
                grid.innerHTML = '';
                const filtrados = filtro === 'all' ? productos : productos.filter(p => p.categoria === filtro);

                if (filtrados.length === 0) {
                    grid.innerHTML = `<p style="color: #888; text-align: center; grid-column: 1/-1; padding: 40px;">No hay productos en esta categoría.</p>`;
                    return;
                }

                filtrados.forEach((producto, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'card-wrapper hidden-scroll';
                    wrapper.style.transitionDelay = `${index * 0.1}s`;
                    wrapper.dataset.id = producto.id;

                    const descCorta = producto.descripcion;

                    const disponible = producto.disponible !== false;
                    const badgeAgotado = !disponible ? `<span class="agotado-badge">Agotado</span>` : '';

                    wrapper.innerHTML = `
                        <div class="card" id="card-${producto.id}" data-id="${producto.id}">
                            <div class="card-img-container">
                                <img src="${producto.imagen}" alt="${producto.nombre}" class="card-img" id="img-${producto.id}" loading="lazy">
                                ${badgeAgotado}
                            </div>
                            <div class="card-content">
                                <h3 class="card-title">${producto.nombre}</h3>
                                <p class="card-desc">${descCorta}</p>
                                <div class="card-footer">
                                    <span class="price"><span>$</span>${producto.precio.toFixed(2)}</span>
                                    <button class="btn-add" data-id="${producto.id}" aria-label="Añadir ${producto.nombre} al carrito" ${!disponible ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(wrapper);

                    applyTiltToElement(wrapper.querySelector('.card-img'), 5);
                    applyTiltToElement(wrapper.querySelector('.price'), 6);
                });

                setTimeout(() => initScrollObserver(), 50);
                initCardTilt();

                document.querySelectorAll('.card').forEach(card => {
                    card.removeEventListener('click', handleCardClick);
                    card.addEventListener('click', handleCardClick);
                });

                document.querySelectorAll('.btn-add:not([disabled])').forEach(btn => {
                    btn.removeEventListener('click', handleAddClick);
                    btn.addEventListener('click', handleAddClick);
                });
            }

            // ============================================
            // CONFIGURAR INTERCAMBIO DE IMÁGENES EN EL MODAL
            // ============================================
            function configurarIntercambioImagenes(contenedor) {
                const portada = contenedor.querySelector('.card-img-container img');
                if (!portada) return;

                const miniaturas = contenedor.querySelectorAll('.galeria-extra img');
                if (miniaturas.length === 0) return;

                miniaturas.forEach(miniatura => {
                    miniatura.removeEventListener('click', handleMiniaturaClick);
                    miniatura.addEventListener('click', handleMiniaturaClick);

                    function handleMiniaturaClick(e) {
                        e.stopPropagation();

                        const urlPortada = portada.src;
                        const urlMiniatura = this.src;

                        portada.src = urlMiniatura;
                        this.src = urlPortada;

                        this.style.transition = 'transform 0.15s ease, filter 0.15s ease';
                        this.style.transform = 'scale(0.9)';
                        this.style.filter = 'brightness(1.5)';
                        setTimeout(() => {
                            this.style.transform = 'scale(1)';
                            this.style.filter = 'brightness(1)';
                        }, 200);

                        portada.style.transition = 'transform 0.2s ease';
                        portada.style.transform = 'scale(0.98)';
                        setTimeout(() => {
                            portada.style.transform = 'scale(1)';
                        }, 200);
                    }
                });
            }

            // ============================================
            // ABRIR / CERRAR DETALLE
            // ============================================
            function abrirDetalle(productoId) {
                const producto = obtenerProducto(productoId);
                if (!producto) return;

                const cardOriginal = document.querySelector(`.card[data-id="${productoId}"]`);
                if (!cardOriginal) return;

                const clone = cardOriginal.cloneNode(true);
                const descLarga = producto.descripcion_larga ? 
                    `<div class="descripcion-larga">${producto.descripcion_larga}</div>` : '';
                const imagenesExtra = producto.imagenes_extra && producto.imagenes_extra.length > 0 
                    ? producto.imagenes_extra.map(img => `<img src="${img}" alt="${producto.nombre} - vista extra" loading="lazy">`).join('')
                    : '';
                const galeriaHtml = imagenesExtra ? `<div class="galeria-extra">${imagenesExtra}</div>` : '';

                const descElement = clone.querySelector('.card-desc');
                if (descElement) {
                    const parent = descElement.parentNode;
                    if (descLarga) {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = descLarga;
                        parent.insertBefore(tempDiv.firstElementChild, descElement.nextSibling);
                    }
                    if (galeriaHtml) {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = galeriaHtml;
                        parent.insertBefore(tempDiv.firstElementChild, descElement.nextSibling.nextSibling);
                    }
                }

                const footerOriginal = clone.querySelector('.card-footer');
                if (footerOriginal) {
                    const btnAdd = footerOriginal.querySelector('.btn-add');
                    if (btnAdd) {
                        const nuevoBtn = document.createElement('button');
                        nuevoBtn.className = 'btn-add';
                        nuevoBtn.dataset.id = producto.id;
                        nuevoBtn.setAttribute('aria-label', `Añadir ${producto.nombre} al carrito`);
                        nuevoBtn.innerHTML = '<i class="fa-solid fa-plus"></i>';
                        if (!producto.disponible) {
                            nuevoBtn.disabled = true;
                            nuevoBtn.style.opacity = '0.5';
                            nuevoBtn.style.cursor = 'not-allowed';
                        }
                        btnAdd.parentNode.replaceChild(nuevoBtn, btnAdd);
                    }
                }

                detalleContenido.innerHTML = '';
                detalleContenido.appendChild(clone);

                configurarIntercambioImagenes(detalleContenido);

                detalleOverlay.classList.add('visible');
                document.body.classList.add('modo-detalle');

                if (cardOriginal) {
                    const wrapper = cardOriginal.closest('.card-wrapper');
                    if (wrapper) wrapper.classList.add('activa');
                }

                const nuevoBtn = detalleContenido.querySelector('.btn-add');
                if (nuevoBtn && !nuevoBtn.disabled) {
                    nuevoBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const producto = obtenerProducto(id);
                        if (producto) {
                            const img = detalleContenido.querySelector('.card-img');
                            if (img) {
                                flyToCartDesdeElemento(img, producto);
                            } else {
                                agregarAlCarrito(id);
                            }
                        }
                    });
                }

                document.body.style.overflow = 'hidden';
            }

            function cerrarDetalle() {
                detalleOverlay.classList.remove('visible');
                document.body.classList.remove('modo-detalle');
                document.body.style.overflow = '';
                document.querySelectorAll('.card-wrapper.activa').forEach(w => w.classList.remove('activa'));
                setTimeout(() => {
                    detalleContenido.innerHTML = '';
                }, 400);
            }

            // ============================================
            // MANEJADOR DE CLICK EN TARJETA
            // ============================================
            function handleCardClick(event) {
                if (event.target.closest('.btn-add') || event.target.closest('a')) {
                    return;
                }
                const card = event.currentTarget;
                const id = parseInt(card.dataset.id);
                if (!id) return;
                abrirDetalle(id);
            }

            // ============================================
            // FLY TO CART DESDE UN ELEMENTO IMAGEN
            // ============================================
            function flyToCartDesdeElemento(imgElement, producto) {
                if (!imgElement) return;

                const rectOrigin = imgElement.getBoundingClientRect();
                const clone = imgElement.cloneNode(true);
                clone.className = 'flying-img';
                clone.style.top = `${rectOrigin.top}px`;
                clone.style.left = `${rectOrigin.left}px`;
                clone.style.width = `${rectOrigin.width}px`;
                clone.style.height = `${rectOrigin.height}px`;
                clone.style.opacity = '1';
                document.body.appendChild(clone);

                const cartRect = cartBtn.getBoundingClientRect();
                const destinoX = cartRect.left + cartRect.width / 2 - 30;
                const destinoY = cartRect.top + cartRect.height / 2 - 30;

                const startX = rectOrigin.left;
                const startY = rectOrigin.top;
                const startW = rectOrigin.width;
                const startH = rectOrigin.height;
                const endW = 20;
                const endH = 20;
                const duracion = 800;
                const inicio = performance.now();

                function animarVuelo(timestamp) {
                    const progreso = Math.min((timestamp - inicio) / duracion, 1);
                    const ease = 1 - Math.pow(1 - progreso, 3);
                    const currentX = startX + (destinoX - startX) * ease;
                    const currentY = startY + (destinoY - startY) * ease;
                    const currentW = startW + (endW - startW) * ease;
                    const currentH = startH + (endH - startH) * ease;
                    const currentOpacity = 1 - ease * 0.5;

                    clone.style.top = `${currentY}px`;
                    clone.style.left = `${currentX}px`;
                    clone.style.width = `${currentW}px`;
                    clone.style.height = `${currentH}px`;
                    clone.style.opacity = currentOpacity;

                    if (progreso < 1) {
                        requestAnimationFrame(animarVuelo);
                    } else {
                        clone.remove();
                        agregarAlCarrito(producto.id);
                        cartCount.classList.remove('cart-bump');
                        void cartCount.offsetWidth;
                        cartCount.classList.add('cart-bump');
                    }
                }

                requestAnimationFrame(animarVuelo);
            }

            // ============================================
            // MANEJADOR DE CLICK AÑADIR (desde grid)
            // ============================================
            function handleAddClick(event) {
                event.stopPropagation();
                const btn = event.currentTarget;
                const id = parseInt(btn.dataset.id);
                const producto = obtenerProducto(id);
                if (!producto) return;
                if (producto.disponible === false) {
                    alert('Este producto está agotado.');
                    return;
                }
                const imgElement = document.getElementById(`img-${id}`);
                if (imgElement) {
                    flyToCartDesdeElemento(imgElement, producto);
                } else {
                    agregarAlCarrito(id);
                }
            }

            // ============================================
            // GESTIÓN DEL CARRITO (con total en Bs.)
            // ============================================
            function agregarAlCarrito(id) {
                const existente = carrito.find(item => item.id === id);
                if (existente) {
                    existente.cantidad += 1;
                } else {
                    carrito.push({ id, cantidad: 1 });
                }
                guardarCarrito();
                actualizarCarrito();
            }

            function eliminarDelCarrito(id) {
                carrito = carrito.filter(item => item.id !== id);
                guardarCarrito();
                actualizarCarrito();
            }

            function cambiarCantidad(id, delta) {
                const item = carrito.find(item => item.id === id);
                if (!item) return;
                const nuevaCant = item.cantidad + delta;
                if (nuevaCant <= 0) {
                    eliminarDelCarrito(id);
                } else {
                    item.cantidad = nuevaCant;
                    guardarCarrito();
                    actualizarCarrito();
                }
            }

            function actualizarCarrito() {
                const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
                cartCount.innerText = totalItems;

                cartItemsContainer.innerHTML = '';
                let totalPrecio = 0;

                carrito.forEach((item, index) => {
                    const producto = obtenerProducto(item.id);
                    if (!producto) return;
                    const subtotal = producto.precio * item.cantidad;
                    totalPrecio += subtotal;

                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.style.animationDelay = `${index * 0.05}s`;
                    div.dataset.id = item.id;
                    div.innerHTML = `
                        <img src="${producto.imagen}" alt="${producto.nombre}" loading="lazy">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${producto.nombre}</div>
                            <div class="cart-item-price">$${producto.precio.toFixed(2)}</div>
                            <div class="cart-item-actions">
                                <button class="qty-btn" data-action="decr" data-id="${item.id}" aria-label="Disminuir cantidad">−</button>
                                <span class="qty-number">${item.cantidad}</span>
                                <button class="qty-btn" data-action="incr" data-id="${item.id}" aria-label="Aumentar cantidad">+</button>
                            </div>
                        </div>
                        <button class="remove-item" data-id="${item.id}" aria-label="Eliminar producto del carrito">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    `;
                    cartItemsContainer.appendChild(div);
                });

                animarNumero(cartTotal, parseFloat(cartTotal.innerText) || 0, totalPrecio, 400);

                if (tasaDolar !== null && totalPrecio > 0) {
                    const totalBs = totalPrecio * tasaDolar;
                    cartTotalBs.textContent = totalBs.toFixed(2);
                    totalBsDiv.style.display = 'flex';
                } else {
                    totalBsDiv.style.display = 'none';
                }

                document.querySelectorAll('.qty-btn').forEach(btn => {
                    btn.removeEventListener('click', handleQtyClick);
                    btn.addEventListener('click', handleQtyClick);
                });
                document.querySelectorAll('.remove-item').forEach(btn => {
                    btn.removeEventListener('click', handleRemoveClick);
                    btn.addEventListener('click', handleRemoveClick);
                });
            }

            function handleQtyClick(event) {
                const btn = event.currentTarget;
                const id = parseInt(btn.dataset.id);
                const action = btn.dataset.action;
                const delta = action === 'incr' ? 1 : -1;
                cambiarCantidad(id, delta);
            }

            function handleRemoveClick(event) {
                const btn = event.currentTarget;
                const id = parseInt(btn.dataset.id);
                const itemElement = btn.closest('.cart-item');
                if (itemElement) {
                    itemElement.classList.add('removing');
                    setTimeout(() => {
                        eliminarDelCarrito(id);
                    }, 300);
                } else {
                    eliminarDelCarrito(id);
                }
            }

            function animarNumero(elemento, inicio, fin, duracion) {
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duracion, 1);
                    const valor = (progress * (fin - inicio) + inicio);
                    elemento.innerText = valor.toFixed(2);
                    if (progress < 1) {
                        requestAnimationFrame(step);
                    }
                };
                requestAnimationFrame(step);
            }

            // ============================================
            // EFECTO TILT (con mejora: se desactiva en detalle)
            // ============================================
            function applyTiltToElement(el, intensity = 10) {
                if (!el) return;
                el._tiltFrameId = null;

                el.addEventListener('mousemove', (e) => {
                    if (document.body.classList.contains('modo-detalle')) return;
                    if (el._tiltFrameId) cancelAnimationFrame(el._tiltFrameId);
                    el._tiltFrameId = requestAnimationFrame(() => {
                        const rect = el.getBoundingClientRect();
                        const x = e.clientX - rect.left;
                        const y = e.clientY - rect.top;
                        const centerX = rect.width / 2;
                        const centerY = rect.height / 2;
                        const rotateX = ((y - centerY) / intensity).toFixed(2);
                        const rotateY = ((centerX - x) / intensity).toFixed(2);
                        el.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                        el._tiltFrameId = null;
                    });
                });

                el.addEventListener('mouseleave', () => {
                    if (el._tiltFrameId) {
                        cancelAnimationFrame(el._tiltFrameId);
                        el._tiltFrameId = null;
                    }
                    el.style.transition = 'transform 0.5s ease-out';
                    el.style.transform = 'rotateX(0deg) rotateY(0deg)';
                    setTimeout(() => {
                        el.style.transition = 'transform 0.1s';
                    }, 500);
                });
            }

            function initCardTilt() {
                const cards = document.querySelectorAll('.card');
                cards.forEach(card => {
                    if (card._tiltInit) return;
                    card._tiltInit = true;
                    let frameId = null;
                    card.addEventListener('mousemove', (e) => {
                        if (document.body.classList.contains('modo-detalle')) return;
                        if (frameId) cancelAnimationFrame(frameId);
                        frameId = requestAnimationFrame(() => {
                            const rect = card.getBoundingClientRect();
                            const x = e.clientX - rect.left;
                            const y = e.clientY - rect.top;
                            const centerX = rect.width / 2;
                            const centerY = rect.height / 2;
                            const rotateX = ((y - centerY) / 10).toFixed(2);
                            const rotateY = ((centerX - x) / 10).toFixed(2);
                            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
                            frameId = null;
                        });
                    });
                    card.addEventListener('mouseleave', () => {
                        if (frameId) {
                            cancelAnimationFrame(frameId);
                            frameId = null;
                        }
                        card.style.transition = 'transform 0.5s ease-out';
                        card.style.transform = 'rotateX(0deg) rotateY(0deg)';
                        setTimeout(() => {
                            card.style.transition = 'transform 0.1s';
                        }, 500);
                    });
                });
            }

            function initPersistentTilt() {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    applyTiltToElement(btn, 12);
                });
                applyTiltToElement(header, 20);
            }

            // ============================================
            // OBSERVADOR DE SCROLL
            // ============================================
            function initScrollObserver() {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('show-scroll');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.hidden-scroll').forEach(el => observer.observe(el));
            }

            // ============================================
            // TOGGLE CARRITO
            // ============================================
            function toggleSidebar() {
                cartSidebar.classList.toggle('open');
                cartOverlay.classList.toggle('show');
                document.body.style.overflow = cartSidebar.classList.contains('open') ? 'hidden' : '';
            }

            cartBtn.addEventListener('click', toggleSidebar);
            closeCartBtn.addEventListener('click', toggleSidebar);
            cartOverlay.addEventListener('click', toggleSidebar);

            // ============================================
            // MENÚ HAMBURGUESA
            // ============================================
            menuToggle.addEventListener('click', () => {
                const isOpen = mainNav.classList.toggle('open');
                menuToggle.setAttribute('aria-expanded', isOpen);
                menuToggle.innerHTML = isOpen ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-bars"></i>';
            });

            document.querySelectorAll('#main-nav a').forEach(link => {
                link.addEventListener('click', () => {
                    mainNav.classList.remove('open');
                    menuToggle.setAttribute('aria-expanded', 'false');
                    menuToggle.innerHTML = '<i class="fa-solid fa-bars"></i>';
                });
            });

            // ============================================
            // BOTÓN WHATSAPP (con total en Bs. y USD)
            // ============================================
            whatsappBtn.addEventListener('click', () => {
                if (carrito.length === 0) {
                    alert('Tu carrito está vacío. Agrega algunos productos.');
                    return;
                }
                let mensaje = '¡Hola! Quiero hacer el siguiente pedido:%0A';
                let total = 0;
                carrito.forEach(item => {
                    const producto = obtenerProducto(item.id);
                    if (!producto) return;
                    const subtotal = producto.precio * item.cantidad;
                    total += subtotal;
                    mensaje += `- ${producto.nombre} x${item.cantidad} = $${subtotal.toFixed(2)}%0A`;
                });
                mensaje += `%0ATotal: $${total.toFixed(2)}`;
                if (tasaDolar !== null && total > 0) {
                    const totalBs = total * tasaDolar;
                    mensaje += ` (Bs. ${totalBs.toFixed(2)})`;
                }
                const url = `https://wa.me/584141234567?text=${mensaje}`;
                window.open(url, '_blank');
            });

            // ============================================
            // EVENTOS DEL DETALLE (cerrar)
            // ============================================
            detalleCerrar.addEventListener('click', cerrarDetalle);
            detalleOverlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    cerrarDetalle();
                }
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && detalleOverlay.classList.contains('visible')) {
                    cerrarDetalle();
                }
            });

            // ============================================
            // INICIALIZACIÓN
            // ============================================
            document.addEventListener('DOMContentLoaded', () => {
                cargarCarrito();
                cargarProductosDesdeJSON();
            });

        })();
    </script>
